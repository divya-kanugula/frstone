<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>
<body>

    <h1>Student Registration</h1>

    <form>

        <label>Name:</label>
        <input type="text">

        <br><br>

        <label>Email:</label>
        <input type="email">

        <br><br>

        <label>Course:</label>

        <select>
            <option>Computer Science</option>
            <option>Information Technology</option>
            <option>Electronics</option>
        </select>

        <br><br>

        <button type="submit">Register</button>

    </form>

</body>
</html>
